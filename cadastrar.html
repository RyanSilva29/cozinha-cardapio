<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <form action="" id="formCadastrar">
    <h2>Faça seu cadastro!</h2>

    <fieldset>
    <legend>Nome</legend>
    <input type="text" placeholder="" id="nome"><br>
    </fieldset>

    <fieldset>
    <legend>Email</legend>
    <input type="email" placeholder="" id="email"><br>
    </fieldset>

    <fieldset>
    <legend>Senha</legend>
    <input type="password" placeholder="" id="senha"><br>
    </fieldset>

    <fieldset>
    <legend>Confirmar</legend>
    <input type="password" placeholder="" id="confirmar"><br>
    </fieldset>

    <button type="submit" value="cadastrar" id="cadastrar">Cadastrar</button><br>
    </form>
    </main>
    <script type="module" src="./js/cadastro.js"></script>
</body>
</html>
